name: Prepare HikaShop v1.0.1 review draft

on:
  workflow_dispatch:
  push:
    branches: [fix/hikashop-1.0.1-review]
    paths: [.github/workflows/review-v1.0.1.yml]

permissions:
  contents: write

concurrency:
  group: hikashop-review-v1.0.1
  cancel-in-progress: false

jobs:
  review-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.0.1
      PACKAGE: pkg_teya_hikashop-1.0.1.zip
      EXPECTED_SHA256: 927fe340a94b7e063829f60cf1d1efe7fa67941a854f59f19cdb1a11c0487078
    steps:
      - name: Verify archive and prepare unpublished review draft
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C source fetch --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          cd source
          python3 tools/build-packages.py hikashop
          printf '%s  %s\n' "$EXPECTED_SHA256" "dist/$PACKAGE" | sha256sum --check -
          (cd dist && sha256sum "$PACKAGE" > "$PACKAGE.sha256")
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/teya-review-state; then
            test "$(cat /tmp/teya-review-state)" = true || { echo 'Refusing to modify a published release'; exit 1; }
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --notes-file docs/RELEASE-NOTES.md
            gh release upload "$TAG" "dist/$PACKAGE" "dist/$PACKAGE.sha256" --clobber
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Teya Payments for HikaShop 1.0.1 — marketplace review" \
              --notes-file docs/RELEASE-NOTES.md "dist/$PACKAGE" "dist/$PACKAGE.sha256"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true
          gh release view "$TAG" --json url,isDraft,assets \
            --jq '{url:.url,isDraft:.isDraft,assets:[.assets[]|{name:.name,size:.size}]}'
