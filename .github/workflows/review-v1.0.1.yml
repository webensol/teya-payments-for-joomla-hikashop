name: Update HikaShop v1.0.1 draft notes

on:
  workflow_dispatch:
  push:
    branches: [fix/hikashop-1.0.1-review]
    paths: [.github/workflows/review-v1.0.1.yml, docs/RELEASE-NOTES.md]

permissions:
  contents: write

concurrency:
  group: hikashop-review-v1.0.1
  cancel-in-progress: false

jobs:
  review-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.0.1
    steps:
      - name: Update existing unpublished review draft description only
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C source fetch --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          cd source
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true || { echo 'Refusing to modify a published release'; exit 1; }
          gh release edit "$TAG" --draft --notes-file docs/RELEASE-NOTES.md
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true
          gh release view "$TAG" --json url,isDraft,assets \
            --jq '{url:.url,isDraft:.isDraft,assets:[.assets[]|{name:.name,size:.size}]}'
