name: Publish Teya Payments for HikaShop v1.0.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.0.2.yml]

permissions:
  contents: write

concurrency:
  group: hikashop-release-v1.0.2
  cancel-in-progress: false

jobs:
  publish-v1-0-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.0.2
      PACKAGE: pkg_teya_hikashop-1.0.2.zip
      EXPECTED_SHA256: 73d5c78775412c6a59127e78520a6580ee1bbb7c3b355ea63fa501b068cc490f
    steps:
      - name: Verify the package and publish the release
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = webensol/teya-payments-for-joomla-hikashop
          test "$GITHUB_REF" = refs/heads/main
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          cd source
          python3 tools/build-packages.py hikashop
          printf '%s  %s\n' "$EXPECTED_SHA256" "dist/$PACKAGE" | sha256sum --check -
          (cd dist && sha256sum "$PACKAGE" > "$PACKAGE.sha256")

          if gh release view "$TAG" --json isDraft,targetCommitish > /tmp/teya-release-state.json; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path('/tmp/teya-release-state.json').read_text())
          assert release['isDraft'], 'Refusing to modify a published release'
          assert release['targetCommitish'] == os.environ['GITHUB_SHA'], 'Draft belongs to a different commit'
          PY
            gh release upload "$TAG" "dist/$PACKAGE" "dist/$PACKAGE.sha256" --clobber
          else
            gh release create "$TAG" "dist/$PACKAGE" "dist/$PACKAGE.sha256" \
              --draft --target "$GITHUB_SHA" --title "Teya Payments for HikaShop 1.0.2" \
              --notes-file docs/RELEASE-NOTES.md
          fi

          gh api "repos/$GH_REPO/releases" --paginate --slurp > /tmp/teya-releases.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          pages = json.loads(Path('/tmp/teya-releases.json').read_text())
          [release] = [release for page in pages for release in page if release['tag_name'] == os.environ['TAG']]
          assert release['draft'] and not release['prerelease']
          assert release['target_commitish'] == os.environ['GITHUB_SHA']
          assert release['body'].strip() == Path('docs/RELEASE-NOTES.md').read_text().strip()
          assets = {asset['name']: asset for asset in release['assets']}
          package = os.environ['PACKAGE']
          for name in (package, package + '.sha256'):
              expected = hashlib.sha256(Path('dist', name).read_bytes()).hexdigest()
              assert assets[name]['digest'] == 'sha256:' + expected, 'Uploaded asset digest mismatch'
          PY
          gh release edit "$TAG" --draft=false --prerelease=false --latest
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease
